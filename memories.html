<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Memory Fragments</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="bg"></div>

    <div class="stars"></div>

    <div id="transition"
    class="transition-overlay"></div>



    <div class="memory-container"
    id="memory-page">

        <div class="memory-box">

            <img
            id="memory-image"
            src="images/memory1.png"
            class="memory-photo">



            <p id="memory-caption"
            class="memory-caption">

                still one of my favorite moments 😭

            </p>

        </div>



        <p class="memory-hint">
            click anywhere
        </p>

    </div>



    <script src="script.js"></script>

</body>
</html>
